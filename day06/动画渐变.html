<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
.a1{width: 200px;  height: 200px;  background-color: aqua;
    /* 属性1：要操作的属性名 */
    /* 属性2：动画执行的时间 单位：s  ms */
    /* 属性3：过度的变化曲线 */
    /* transition: all 300ms ease-in; */
transition: all 3s ease-in;
/* transform:translate(20px（x轴） ,30px  （y轴）) 平移位置。注：x轴与y轴的参数要用英语的逗号隔开
    transform: translateX(100%),translateY(100%)相对于元素宽度，长度本身 
    transform：scale(1.1) 缩放倍数/scaleX()，水平方向放大。scaleY(),垂直方向放大 
    transform: rotate(45deg);正数是顺时针转动，负数是逆时针转动。deg是角度单位 
    transform: skew(20deeg（x轴） 30deg（y轴）); 倾斜角度。 */

}
.a1:hover{
background-color: lightseagreen;
transform: translate(200px,300px) rotate(90deg) scale(1.5);

}





</style>
<body>
    <div class="a1">



    </div>





</body>
</html>
